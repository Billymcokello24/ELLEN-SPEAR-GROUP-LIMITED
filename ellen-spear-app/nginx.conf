server {
    listen 80;
    server_name ellenspeargroup.com www.ellenspeargroup.com;
    root /var/www/ellenspeargroup.com/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    access_log /var/log/nginx/ellenspeargroup.com.access.log;
    error_log /var/log/nginx/ellenspeargroup.com.error.log;
}
